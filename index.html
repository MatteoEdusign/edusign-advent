<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1C414D;
            --accent-color: #FFD78B;
            --tertiary-color: #B1E1B9;
            --text-color: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.1);
            --card-border: rgba(255, 255, 255, 0.2);
            --glass-blur: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Snow & Star Animation */
        .snow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .snowflake {
            position: absolute;
            top: -10px;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            animation: fall linear infinite;
        }

        .star {
            position: absolute;
            top: -20px;
            color: var(--accent-color);
            font-size: 12px;
            opacity: 0.9;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh);
            }
        }

        /* Header */
        header {
            text-align: center;
            padding: 2rem 1rem;
            z-index: 10;
        }

        .logo {
            max-width: 380px;
            /* Increased from 300px */
            width: 85%;
            height: auto;
            margin-bottom: 1rem;
        }

        p.subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Flying Sleigh Animation */
        .sleigh-container {
            position: fixed;
            top: 15%;
            left: -300px;
            width: 250px;
            z-index: 1;
            /* Behind grid but visible */
            opacity: 0.8;
            pointer-events: none;
            animation: flyAcross 25s linear infinite;
        }

        .sleigh-img {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 10px 10px rgba(0, 0, 0, 0.2));
        }

        @keyframes flyAcross {
            0% {
                left: -300px;
                transform: translateY(0) rotate(-2deg);
            }

            25% {
                transform: translateY(20px) rotate(0deg);
            }

            50% {
                transform: translateY(0) rotate(2deg);
            }

            75% {
                transform: translateY(-20px) rotate(0deg);
            }

            100% {
                left: 110%;
                /* Fly off screen */
                transform: translateY(0) rotate(-2deg);
            }
        }

        /* Grid */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1.5rem;
            width: 90%;
            max-width: 1000px;
            padding: 2rem 0 4rem 0;
            z-index: 10;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--card-border);
            border-radius: 12px;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            border-color: var(--accent-color);
        }

        .card-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
        }

        .card-status {
            font-size: 1.5rem;
        }

        /* Locked State */
        .card.locked {
            cursor: not-allowed;
            opacity: 0.6;
            background: rgba(15, 61, 70, 0.6);
        }

        .card.locked:hover {
            transform: none;
            box-shadow: none;
            border-color: var(--card-border);
        }

        .card.locked .card-number {
            color: rgba(255, 255, 255, 0.5);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: #1a4d58;
            /* Slightly lighter than bg for contrast */
            border: 1px solid var(--accent-color);
            border-radius: 16px;
            padding: 2.5rem;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .close-btn:hover {
            opacity: 1;
            color: var(--accent-color);
        }

        .modal-title {
            font-size: 1.8rem;
            color: var(--accent-color);
            margin-bottom: 1.5rem;
            font-weight: 700;
        }

        .modal-body {
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .modal-body a {
            color: var(--accent-color);
            text-decoration: none;
            border-bottom: 1px dashed var(--accent-color);
            transition: border-bottom 0.2s;
        }

        .modal-body a:hover {
            border-bottom-style: solid;
        }

        .modal-body img {
            width: 100%;
            max-width: 400px;
            height: auto;
            border-radius: 8px;
            margin: 1rem 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        /* Christmas Anecdote Widget */
        .anecdote-widget {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--accent-color);
            border-radius: 16px;
            padding: 1.5rem;
            max-width: 280px;
            z-index: 50;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .anecdote-widget h3 {
            color: var(--accent-color);
            font-size: 1rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .anecdote-text {
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 1rem;
            min-height: 80px;

        .anecdote-btn {
            background: var(--accent-color);
            color: var(--bg-color);

            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: transform 0.2s;
        }

        .anecdote-btn:hover {
            transform: scale(1.05);
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .anecdote-widget {
                display: none;
            }
        }

        @media (max-width: 600px) {
            .calendar-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 1rem;
            }

            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

                `;
            } else {
                card.innerHTML = `
                    <div class="card-number">${i}</div>
                    <div class="card-status">✨</div>
                `;
                card.addEventListener('click', () => openModal(i));
            }

            grid.appendChild(card);
        }

        // Modal Logic
        function openModal(day) {
            const data = contents[day];
            if (data) {
                modalTitle.textContent = data.title;
                modalBody.innerHTML = data.content;
                modalOverlay.classList.add('active');
            }
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
        }

        closeBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        // Escape key to close
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                closeModal();
            }
        });

        // Christmas Anecdotes Generator
        const anecdotes = [
            "🇮🇸 En Islande, on offre des livres le 24 décembre et on passe la soirée à lire. C'est le 'Jólabókaflóð' (l'inondation de livres de Noël).",
            "🇪🇸 En Catalogne, le 'Caga Tió' est une bûche qui 'fait caca' des cadeaux quand les enfants la frappent avec un bâton !",
            "🇻🇪 Au Venezuela, les habitants de Caracas vont à la messe de Noël... en rollers ! Les rues sont fermées pour l'occasion.",
            "🇦🇺 En Australie, Noël se fête à la plage en maillot de bain. Le Père Noël arrive parfois en surf !",
            "🇯🇵 Au Japon, la tradition est de manger du KFC le soir de Noël. Il faut réserver des semaines à l'avance !",
            "🇺🇦 En Ukraine, on décore le sapin avec des toiles d'araignées artificielles pour porter chance.",
            "🇳🇴 En Norvège, on cache tous les balais la veille de Noël pour éviter que les sorcières ne les volent.",
            "🇬🇧 En Angleterre victorienne, on envoyait des cartes de Noël avec... des grenouilles habillées. Oui, vraiment.",
            "🇮🇹 En Italie, la Befana (une gentille sorcière) apporte des cadeaux le 6 janvier aux enfants sages.",
            "🇫🇮 En Finlande, on va au sauna en famille le soir de Noël. C'est une tradition sacrée.",
            "🇲🇽 Au Mexique, les enfants cassent des piñatas en forme d'étoile pendant les 9 jours avant Noël.",
            "🇿🇦 En Afrique du Sud, on mange des insectes frits comme friandises de Noël. Les chenilles sont très populaires !"
        ];

        const anecdoteText = document.getElementById('anecdote-text');
        const anecdoteBtn = document.getElementById('anecdote-btn');

        function showRandomAnecdote() {
            const randomIndex = Math.floor(Math.random() * anecdotes.length);
            anecdoteText.textContent = anecdotes[randomIndex];
        }

        anecdoteBtn.addEventListener('click', showRandomAnecdote);

        // Snow & Star Generation
        const snowContainer = document.getElementById('snow-container');
        const particleCount = 70; // Increased count for stars + snow

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');

            // 30% chance to be a star
            const isStar = Math.random() > 0.7;

            if (isStar) {
                particle.classList.add('star');
                particle.textContent = '★';
            } else {
                particle.classList.add('snowflake');
            }

            // Random positioning and sizing
            const x = Math.random() * 100;
            const delay = Math.random() * 5;
            const duration = 5 + Math.random() * 10;
            const size = isStar ? (8 + Math.random() * 8) : (2 + Math.random() * 4); // Stars are bigger

            particle.style.left = `${x}%`;
            particle.style.animationDelay = `${delay}s`;
            particle.style.animationDuration = `${duration}s`;

            if (isStar) {
                particle.style.fontSize = `${size}px`;
            } else {
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
            }

            snowContainer.appendChild(particle);
        }
    </script>
</body>
